
import requests
import os
import json

def get_strava_activities():
    client_id = os.getenv("STRAVA_CLIENT_ID")
    client_secret = os.getenv("STRAVA_CLIENT_SECRET")
    refresh_token = os.getenv("STRAVA_REFRESH_TOKEN")

    # Check credentials are available
    if not all([client_id, client_secret, refresh_token]):
        raise RuntimeError(
            "Missing Strava credentials. Check GitHub "
            "Actions secrets and workflow environment."
        )

    # Step 1: Refresh access token
    token_url = "https://www.strava.com/oauth/token"

    payload = {
        "client_id": client_id,
        "client_secret": client_secret,
        "refresh_token": refresh_token,
        "grant_type": "refresh_token"
    }

    response = requests.post(
        token_url,
        data=payload,
        timeout=30
    )

    if not response.ok:
        raise RuntimeError(
            f"Strava authentication failed "
            f"(HTTP {response.status_code}). "
            "Check client credentials and refresh token."
        )

    response_data = response.json()
    access_token = response_data.get("access_token")

    if not access_token:
        raise RuntimeError(
            "Strava did not return an access token."
        )

    print("Strava authentication successful.")

    # Step 2: Fetch activities
    activities_url = (
        "https://www.strava.com/api/v3/athlete/activities"
    )

    headers = {
        "Authorization": f"Bearer {access_token}"
    }

    activities_response = requests.get(
        activities_url,
        headers=headers,
        params={"per_page": 100},
        timeout=30
    )

    activities_response.raise_for_status()
    activities = activities_response.json()

    # Step 3: Save activities
    with open("strava_data.json", "w") as f:
        json.dump(activities, f, indent=2)

    print(
        f"Strava data collected successfully. "
        f"Retrieved {len(activities)} activities."
    )

if __name__ == "__main__":
    get_strava_activities()

