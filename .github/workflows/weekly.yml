
name: Weekly Training Plan

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-weekly-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect Strava data
        run: python strava_collector.py

      - name: Collect Intervals.icu data
        run: python intervals_collector.py

      - name: Collect calendar data
        run: python calendar_collector.py

      - name: Generate weekly training plan
        run: python generate_plan.py

      - name: Commit weekly plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weekly_plan.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update weekly training plan"
            git push
          fi
